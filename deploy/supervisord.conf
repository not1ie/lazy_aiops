[supervisord]
nodaemon=true
logfile=/var/log/supervisord.log
logfile_maxbytes=10MB
loglevel=info

[program:lazy-aiops]
command=/app/lazy-auto-ops
directory=/app
autostart=true
autorestart=true
startsecs=3
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
priority=10

[program:lazysre]
command=python -m lazysre gateway --host 127.0.0.1 --port 19090 --provider %(ENV_LAZYSRE_PROVIDER)s
directory=/app
autostart=true
autorestart=true
startsecs=5
startretries=5
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
priority=20
environment=LAZYSRE_DATA_DIR="/app/data/lazysre",HOME="/root"
